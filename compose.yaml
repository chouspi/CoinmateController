services:
  coinmate-controller:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - coinmate-controller
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - coinmate-data:/data

networks:
  coinmate-controller:
    name: coinmate-controller

volumes:
  coinmate-data:
